name: Release
on:
  workflow_dispatch:
  release:
    types: [ prereleased, released ]

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Check Publishing Token
        env:
          PUBLISH_TOKEN: ${{ secrets.ORG_GRADLE_PROJECT_INTELLIJPLATFORMPUBLISHINGTOKEN }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "::error::Missing Marketplace publishing token"
            exit 1
          fi

      - name: Prepare Release
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(sed -n 's/^pluginVersion[[:space:]]*=[[:space:]]*//p' gradle.properties)
          test -n "$VERSION"
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "$VERSION" ] && [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "::error::Release tag does not match pluginVersion"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ./gradlew buildPlugin verifyPluginStructure getChangelog --project-version="$VERSION" --no-header --output-file=build/release-notes.md --no-daemon

      - name: Publish to JetBrains Marketplace
        env:
          ORG_GRADLE_PROJECT_intellijPlatformPublishingToken: ${{ secrets.ORG_GRADLE_PROJECT_INTELLIJPLATFORMPUBLISHINGTOKEN }}
        run: ./gradlew publishPlugin --no-daemon

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "build/distributions/intellij-direnv-$VERSION.zip" --clobber
            gh release edit "$VERSION" --draft=false --title "$VERSION" --notes-file build/release-notes.md
          else
            gh release create "$VERSION" "build/distributions/intellij-direnv-$VERSION.zip" \
              --target "$GITHUB_SHA" --title "$VERSION" --notes-file build/release-notes.md
          fi

      - name: Upload Release Asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: gh release upload "$RELEASE_TAG" "build/distributions/intellij-direnv-$VERSION.zip" --clobber
